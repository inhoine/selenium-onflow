name: Automation Regression Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run nightly at 02:00 UTC (09:00 AM VN)
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'chrome'
        type: choice
        options:
          - chrome
          - edge
          - firefox

jobs:
  regression-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Setup Chrome Headless
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: latest

      - name: Run TestNG Tests
        env:
          HEADLESS: "true"
          BROWSER: ${{ github.event.inputs.browser || 'chrome' }}
          WMS_EMAIL: ${{ secrets.WMS_EMAIL }}
          WMS_PASSWORD: ${{ secrets.WMS_PASSWORD }}
          OMS_EMAIL: ${{ secrets.OMS_EMAIL }}
          OMS_PASSWORD: ${{ secrets.OMS_PASSWORD }}
          OPS_EMAIL: ${{ secrets.OPS_EMAIL }}
          OPS_PASSWORD: ${{ secrets.OPS_PASSWORD }}
        run: |
          mvn clean test

      - name: Generate Allure Report
        if: always()
        run: |
          mvn allure:report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
          retention-days: 14

      - name: Upload Failure Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          retention-days: 7

